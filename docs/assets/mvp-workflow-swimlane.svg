    <text class="text" x="115" y="318" text-anchor="middle">ให้ฝ่ายบัญชี</text>

    <rect class="box proc" x="35" y="700" width="160" height="68"/>
    <text class="text" x="115" y="726" text-anchor="middle">แก้ไขหรือส่งเอกสาร</text>
    <text class="text" x="115" y="744" text-anchor="middle">เพิ่มเติม</text>

    <rect class="box acct" x="285" y="90" width="160" height="62"/>
