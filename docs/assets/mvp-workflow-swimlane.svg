  <rect class="bg" x="0" y="0" width="1680" height="1140"/>
  <text class="title" x="60" y="56">Workflow การควบคุมการจ่ายเงิน MVP</text>
  <text class="subtitle" x="60" y="82">ปรับลูกศรใหม่ให้เป็นเส้นตรงและเส้นหักมุม อ่านจากซ้ายไปขวาได้ชัดเจนขึ้น</text>

