<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc">
  <title id="title">แผนภาพขั้นตอนการจ่ายเงิน MVP</title>
  <desc id="desc">เวอร์ชันปฏิบัติงานภาษาไทย จัดลูกศรใหม่ให้เป็นเส้นตรงและเส้นหักมุม อ่านง่าย ลดเส้นไขว้</desc>
  <defs>
    <style>
      .bg { fill: #f5f8fb; }
      .panel { fill: #ffffff; stroke: #d7e2ea; stroke-width: 1.5; }
      .grid { stroke: #dbe5ec; stroke-width: 1; }
      .title { font: 700 28px Arial, sans-serif; fill: #12344d; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #557082; }
      .lane { font: 700 18px Arial, sans-serif; fill: #17384d; }
      .text { font: 600 14px Arial, sans-serif; fill: #17384d; }
      .small { font: 400 12px Arial, sans-serif; fill: #5c7485; }
      .box { rx: 16; ry: 16; stroke-width: 1.5; }
      .proc { fill: #e9f7ee; stroke: #7fc59c; }
      .acct { fill: #eef4fd; stroke: #8fb4e2; }
      .fin { fill: #fff4e7; stroke: #efbe72; }
      .appr { fill: #fff0f0; stroke: #e5a3a3; }
      .pay { fill: #ecf9fb; stroke: #8fcfe0; }
      .sys { fill: #f4f1ff; stroke: #b8aaef; }
      .decision { fill: #fffdf2; stroke: #dabc5f; stroke-width: 1.5; }
      .main { stroke: #2f617a; stroke-width: 2.5; fill: none; marker-end: url(#mainArrow); }
      .return { stroke: #c05672; stroke-width: 2.5; fill: none; marker-end: url(#returnArrow); }
      .reject { stroke: #c2410c; stroke-width: 2.5; fill: none; marker-end: url(#rejectArrow); }
      .syslink { stroke: #6f7f8c; stroke-width: 2; fill: none; marker-end: url(#mainArrow); stroke-dasharray: 6 5; }
    </style>
    <marker id="mainArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f617a"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c05672"/>
    </marker>
    <marker id="rejectArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c2410c"/>
    </marker>
