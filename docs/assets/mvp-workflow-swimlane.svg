<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">AP Payment Control — Detailed Workflow and State Machine</title>
  <desc id="desc">Detailed workflow aligned with the program state machine, including maker, checker, sequential approvers, finance payment, return, rejection, and optional payment preparation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#6d28d9"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <style>
      text{font-family:"Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;fill:#172033}.eyebrow{font-size:14px;font-weight:800;letter-spacing:1.6px;fill:#6d28d9}.title{font-size:31px;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:16px;fill:#64748b}.section{font-size:16px;font-weight:800;fill:#334155}.state{font-size:16px;font-weight:800;fill:#3b1b74}.stateSmall{font-size:14px;font-weight:800;fill:#3b1b74}.body{font-size:14px;fill:#475569}.small{font-size:12px;fill:#64748b}.laneTitle{font-size:16px;font-weight:800}.laneSub{font-size:12px;fill:#64748b}.cardTitle{font-size:15px;font-weight:800}.cardBody{font-size:12px;fill:#64748b}.edgeLabel{font-size:12px;font-weight:700;fill:#475569}.edge{fill:none;stroke:#475569;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.purpleEdge{fill:none;stroke:#6d28d9;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}.amberEdge{fill:none;stroke:#d97706;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}.redEdge{fill:none;stroke:#dc2626;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowRed)}
    </style>
  </defs>
  <rect width="1800" height="1280" fill="#f8fafc"/><rect x="28" y="24" width="1744" height="1232" rx="26" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="64" y="66" class="eyebrow">PROGRAM-ALIGNED WORKFLOW · SOURCE OF TRUTH</text><text x="64" y="104" class="title">AP Payment Control — Workflow ขั้นถัดไป</text><text x="64" y="134" class="subtitle">สถานะด้านบนคือ state machine ที่โปรแกรมใช้งานจริง · การเตรียมจ่ายเป็นทางเลือกและไม่ข้ามขั้นอนุมัติ</text>

  <!-- Canonical state rail -->
  <rect x="52" y="162" width="1696" height="232" rx="20" fill="#f8f7ff" stroke="#ddd6fe"/><text x="76" y="194" class="section">Canonical state rail</text><text x="1698" y="194" text-anchor="end" class="small">ลูกศรทุกเส้นอ่านจากซ้ายไปขวา</text>
  <g filter="url(#shadow)"><rect x="70" y="232" width="200" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="310" y="232" width="200" height="82" rx="14" fill="#f4f0ff" stroke="#8b5cf6"/><rect x="550" y="232" width="200" height="82" rx="14" fill="#f4f0ff" stroke="#8b5cf6"/><rect x="790" y="232" width="200" height="82" rx="14" fill="#f4f0ff" stroke="#8b5cf6"/><rect x="1030" y="232" width="200" height="82" rx="14" fill="#f4f0ff" stroke="#8b5cf6"/><rect x="1270" y="232" width="200" height="82" rx="14" fill="#ede9fe" stroke="#7c3aed"/><rect x="1510" y="232" width="200" height="82" rx="14" fill="#ecfdf5" stroke="#10b981"/></g>
  <text x="170" y="263" text-anchor="middle" class="cardTitle">AP Invoice Queue</text><text x="170" y="286" text-anchor="middle" class="cardBody">เลือก invoice ที่ยังไม่ Paid</text>
  <text x="410" y="263" text-anchor="middle" class="stateSmall">Pending Documents</text><text x="410" y="286" text-anchor="middle" class="cardBody">สร้าง Payment Request</text>
  <text x="650" y="258" text-anchor="middle" class="stateSmall">Pending Accounting</text><text x="650" y="279" text-anchor="middle" class="stateSmall">Review</text><text x="650" y="299" text-anchor="middle" class="cardBody">เอกสารครบตาม checklist</text>
  <text x="890" y="258" text-anchor="middle" class="stateSmall">Pending Finance</text><text x="890" y="279" text-anchor="middle" class="stateSmall">Review</text><text x="890" y="299" text-anchor="middle" class="cardBody">รอ Checker ตรวจ</text>
  <text x="1130" y="258" text-anchor="middle" class="stateSmall">Pending Management</text><text x="1130" y="279" text-anchor="middle" class="stateSmall">Approval</text><text x="1130" y="299" text-anchor="middle" class="cardBody">approval tasks ตามลำดับ</text>
  <text x="1370" y="263" text-anchor="middle" class="stateSmall">Approved for Payment</text><text x="1370" y="286" text-anchor="middle" class="cardBody">อนุมัติครบทุก task</text>
  <text x="1610" y="263" text-anchor="middle" class="state">Paid</text><text x="1610" y="286" text-anchor="middle" class="cardBody">บันทึกจ่ายสำเร็จ</text>
  <path d="M270 273 H302" class="purpleEdge"/><path d="M510 273 H542" class="purpleEdge"/><path d="M750 273 H782" class="purpleEdge"/><path d="M990 273 H1022" class="purpleEdge"/><path d="M1230 273 H1262" class="purpleEdge"/><path d="M1470 273 H1502" class="purpleEdge"/>
  <text x="290" y="218" text-anchor="middle" class="edgeLabel">Maker สร้างคำขอ</text><text x="530" y="337" text-anchor="middle" class="edgeLabel">Maker ส่งเอกสาร</text><text x="770" y="218" text-anchor="middle" class="edgeLabel">Maker ส่งให้ Finance</text><text x="1010" y="337" text-anchor="middle" class="edgeLabel">Checker: Document Complete</text><text x="1250" y="218" text-anchor="middle" class="edgeLabel">อนุมัติครบทุก task</text><text x="1490" y="337" text-anchor="middle" class="edgeLabel">รายละเอียดจ่าย + Payment Proof</text>

  <!-- Responsibility lanes -->
  <rect x="52" y="418" width="1696" height="480" rx="20" fill="#ffffff" stroke="#dbe3ef"/><rect x="52" y="418" width="210" height="96" rx="20" fill="#eef6ff"/><rect x="52" y="514" width="210" height="96" fill="#ecfdf5"/><rect x="52" y="610" width="210" height="124" fill="#f5f3ff"/><rect x="52" y="734" width="210" height="164" fill="#fff7ed"/><line x1="262" y1="418" x2="262" y2="898" stroke="#dbe3ef"/><line x1="52" y1="514" x2="1748" y2="514" stroke="#e2e8f0"/><line x1="52" y1="610" x2="1748" y2="610" stroke="#e2e8f0"/><line x1="52" y1="734" x2="1748" y2="734" stroke="#e2e8f0"/>
  <text x="78" y="454" class="laneTitle" fill="#1d4ed8">MAKER</text><text x="78" y="478" class="laneSub">เตรียมและส่งคำขอ</text><text x="78" y="550" class="laneTitle" fill="#047857">CHECKER</text><text x="78" y="574" class="laneSub">ตรวจความครบถ้วน</text><text x="78" y="650" class="laneTitle" fill="#6d28d9">APPROVAL MATRIX</text><text x="78" y="674" class="laneSub">Finance Manager / Approver</text><text x="78" y="694" class="laneSub">/ Executive ตามวงเงิน</text><text x="78" y="774" class="laneTitle" fill="#c2410c">FINANCE PAYMENT</text><text x="78" y="798" class="laneSub">เตรียมจ่ายและปิดรายการ</text>
  <g filter="url(#shadow)"><rect x="292" y="438" width="278" height="58" rx="12" fill="#ffffff" stroke="#93c5fd"/><rect x="594" y="438" width="278" height="58" rx="12" fill="#ffffff" stroke="#93c5fd"/><rect x="896" y="438" width="278" height="58" rx="12" fill="#ffffff" stroke="#93c5fd"/><rect x="624" y="532" width="336" height="60" rx="12" fill="#ffffff" stroke="#6ee7b7"/><rect x="984" y="532" width="350" height="60" rx="12" fill="#ffffff" stroke="#6ee7b7"/><rect x="794" y="634" width="330" height="76" rx="12" fill="#ffffff" stroke="#c4b5fd"/><rect x="1150" y="634" width="410" height="76" rx="12" fill="#ffffff" stroke="#c4b5fd"/><rect x="294" y="758" width="350" height="112" rx="12" fill="#ffffff" stroke="#fdba74"/><rect x="670" y="758" width="430" height="112" rx="12" fill="#ffffff" stroke="#fdba74"/><rect x="1126" y="758" width="400" height="112" rx="12" fill="#ffffff" stroke="#fdba74"/></g>
  <text x="431" y="463" text-anchor="middle" class="cardTitle">สร้างจาก AP Invoice Queue</text><text x="431" y="483" text-anchor="middle" class="cardBody">สถานะเริ่มต้น: Pending Documents</text><text x="733" y="463" text-anchor="middle" class="cardTitle">แนบเอกสาร + Checklist</text><text x="733" y="483" text-anchor="middle" class="cardBody">Submit Documents</text><text x="1035" y="463" text-anchor="middle" class="cardTitle">ส่งต่อ Finance Review</text><text x="1035" y="483" text-anchor="middle" class="cardBody">Submit to Finance</text>
  <text x="792" y="557" text-anchor="middle" class="cardTitle">ตรวจ PO · Invoice · GR</text><text x="792" y="578" text-anchor="middle" class="cardBody">Accepted ครบ + ระบุวิธีจ่าย</text><text x="1159" y="557" text-anchor="middle" class="cardTitle">Document Complete</text><text x="1159" y="578" text-anchor="middle" class="cardBody">ระบบสร้าง approval tasks ตาม matrix</text>
  <text x="959" y="661" text-anchor="middle" class="cardTitle">Active approver ตรวจ task ปัจจุบัน</text><text x="959" y="685" text-anchor="middle" class="cardBody">อนุมัติได้เฉพาะผู้รับมอบหมาย หรือ Admin</text><text x="1355" y="661" text-anchor="middle" class="cardTitle">อนุมัติแบบ Sequential</text><text x="1355" y="683" text-anchor="middle" class="cardBody">ถ้ายังมี task ถัดไป สถานะยังคง Pending Management Approval</text><text x="1355" y="701" text-anchor="middle" class="cardBody">เมื่อครบทุก task จึงไป Approved for Payment</text>
  <text x="469" y="785" text-anchor="middle" class="cardTitle">Payment Batch (ทางเลือก)</text><text x="469" y="808" text-anchor="middle" class="cardBody">รวมเฉพาะ Approved for Payment</text><text x="469" y="829" text-anchor="middle" class="cardBody">draft → locked · ไม่เปลี่ยนสถานะคำขอ</text><text x="469" y="850" text-anchor="middle" class="cardBody">ไม่จำเป็นต้องมี batch ก่อน Mark Paid</text>
  <text x="885" y="785" text-anchor="middle" class="cardTitle">Cheque Register (ทางเลือก)</text><text x="885" y="808" text-anchor="middle" class="cardBody">prepared / signed → released / received / cancelled / void</text><text x="885" y="829" text-anchor="middle" class="cardBody">released → received / cancelled / void</text><text x="885" y="850" text-anchor="middle" class="cardBody">received · cancelled · void เป็นปลายทาง</text>
  <text x="1326" y="785" text-anchor="middle" class="cardTitle">Mark Paid</text><text x="1326" y="808" text-anchor="middle" class="cardBody">Payment date · reference · bank · payer</text><text x="1326" y="829" text-anchor="middle" class="cardBody">ต้องมีเอกสาร Payment Proof</text><text x="1326" y="850" text-anchor="middle" class="cardBody">ระบบอัปเดต AP Invoice ที่เชื่อมไว้เป็น Paid</text>
  <path d="M570 467 H586" class="edge"/><path d="M872 467 H888" class="edge"/><path d="M960 562 H976" class="edge"/><path d="M1124 672 H1142" class="purpleEdge"/><path d="M1560 672 H1600 V620 H1320 V626" class="purpleEdge"/><text x="1460" y="612" text-anchor="middle" class="edgeLabel">มี task ถัดไป → วนตรวจ task ใหม่</text><path d="M644 814 H662" class="edge"/><path d="M1100 814 H1118" class="edge"/>

  <!-- Exception state machine -->
  <rect x="52" y="922" width="1696" height="260" rx="20" fill="#fffdf8" stroke="#f1d6a8"/><text x="76" y="957" class="section">Exception transitions — แยกจากเส้นหลักเพื่ออ่านทิศทางชัดเจน</text>
  <rect x="80" y="985" width="330" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="245" y="1012" text-anchor="middle" class="cardTitle">สถานะที่ Return / Reject ได้</text><text x="245" y="1034" text-anchor="middle" class="cardBody">Pending Accounting · Pending Finance</text><text x="245" y="1052" text-anchor="middle" class="cardBody">Pending Management (เฉพาะ active approver)</text>
  <rect x="470" y="976" width="235" height="88" rx="14" fill="#fff7ed" stroke="#f59e0b"/><text x="588" y="1009" text-anchor="middle" class="stateSmall" fill="#9a3412">Returned for Correction</text><text x="588" y="1033" text-anchor="middle" class="cardBody">บันทึก comment + return_to</text>
  <rect x="760" y="976" width="235" height="88" rx="14" fill="#ffffff" stroke="#93c5fd"/><text x="878" y="1009" text-anchor="middle" class="cardTitle">Maker แก้ไขและ Resubmit</text><text x="878" y="1033" text-anchor="middle" class="cardBody">ระบบตรวจ checklist อีกครั้ง</text>
  <polygon points="1105,1020 1180,976 1255,1020 1180,1064" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="1180" y="1015" text-anchor="middle" class="cardTitle">Checklist</text><text x="1180" y="1036" text-anchor="middle" class="cardBody">ผ่าน?</text>
  <rect x="1325" y="970" width="190" height="66" rx="12" fill="#f4f0ff" stroke="#8b5cf6"/><text x="1420" y="997" text-anchor="middle" class="stateSmall">Pending Accounting</text><text x="1420" y="1017" text-anchor="middle" class="stateSmall">Review</text><rect x="1325" y="1080" width="190" height="66" rx="12" fill="#f4f0ff" stroke="#8b5cf6"/><text x="1420" y="1107" text-anchor="middle" class="stateSmall">Pending Documents</text><text x="1420" y="1128" text-anchor="middle" class="cardBody">Checklist ยังไม่ครบ</text>
  <rect x="1550" y="976" width="160" height="88" rx="14" fill="#fef2f2" stroke="#ef4444"/><text x="1630" y="1014" text-anchor="middle" class="state" fill="#b91c1c">Rejected</text><text x="1630" y="1038" text-anchor="middle" class="cardBody">สถานะปลายทาง</text>
  <path d="M410 1007 H462" class="amberEdge"/><text x="437" y="994" text-anchor="middle" class="edgeLabel" fill="#b45309">Return</text><path d="M705 1020 H752" class="amberEdge"/><path d="M995 1020 H1097" class="amberEdge"/><path d="M1255 1003 H1317" class="purpleEdge"/><text x="1287" y="990" text-anchor="middle" class="edgeLabel">ผ่าน</text><path d="M1180 1064 V1113 H1317" class="purpleEdge"/><text x="1245" y="1102" text-anchor="middle" class="edgeLabel">ไม่ผ่าน</text><path d="M410 1042 H438 V1138 H1530 V1068 H1542" class="redEdge"/><text x="1010" y="1128" text-anchor="middle" class="edgeLabel" fill="#b91c1c">Reject → Rejected (ไม่เข้าสู่ขั้นจ่าย)</text>
  <rect x="52" y="1204" width="1696" height="30" rx="9" fill="#f1f5f9"/><text x="76" y="1225" class="small">SYSTEM CONTROL: ทุก transition บันทึก audit log · approval tasks สร้างจากวงเงิน · Paid จะ sync ไปยัง AP Invoice ที่เชื่อมโยง</text>
</svg>
