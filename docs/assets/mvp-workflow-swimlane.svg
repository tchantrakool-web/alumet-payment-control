    <text class="text" x="1455" y="762" text-anchor="middle">Pending Management Approval</text>

    <rect class="box sys" x="1370" y="790" width="170" height="62"/>
    <text class="text" x="1455" y="816" text-anchor="middle">Rejected</text>
    <text class="small" x="1455" y="834" text-anchor="middle">จาก Management Approval</text>

    <rect class="box sys" x="1370" y="880" width="170" height="62"/>
    <text class="text" x="1455" y="906" text-anchor="middle">สถานะ</text>
    <text class="text" x="1455" y="924" text-anchor="middle">Approved for Payment</text>

    <rect class="box sys" x="1370" y="90" width="170" height="62"/>
    <text class="text" x="1455" y="116" text-anchor="middle">Returned for</text>
    <text class="text" x="1455" y="134" text-anchor="middle">Correction</text>

    <rect class="box sys" x="1370" y="970" width="170" height="62"/>
    <text class="text" x="1455" y="996" text-anchor="middle">สถานะ Paid และ</text>
    <text class="text" x="1455" y="1014" text-anchor="middle">อัปเดต AP Invoice</text>

    <rect class="box sys" x="1370" y="1060" width="170" height="62"/>
