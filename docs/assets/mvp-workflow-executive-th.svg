<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AP Payment Control — Executive Workflow</title>
  <desc id="desc">Executive workflow showing clear ownership, the canonical program states, sequential approval, optional payment preparation, return, and rejection.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6d28d9"/></marker><marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <style>text{font-family:"Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;fill:#172033}.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.5px;fill:#6d28d9}.title{font-size:30px;font-weight:800}.sub{font-size:15px;fill:#64748b}.stepNo{font-size:12px;font-weight:800;fill:#fff}.stepTitle{font-size:17px;font-weight:800}.stepBody{font-size:12px;fill:#64748b}.state{font-size:13px;font-weight:800;fill:#3b1b74}.small{font-size:12px;fill:#64748b}.label{font-size:12px;font-weight:700;fill:#475569}.edge{fill:none;stroke:#6d28d9;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.amber{fill:none;stroke:#d97706;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}.red{fill:none;stroke:#dc2626;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowRed)}</style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/><rect x="24" y="22" width="1552" height="856" rx="26" fill="#fff" stroke="#dbe3ef"/>
  <text x="58" y="62" class="eyebrow">EXECUTIVE VIEW · PROGRAM SOURCE OF TRUTH</text><text x="58" y="100" class="title">เส้นทางอนุมัติและจ่ายเงินที่ตรวจสอบย้อนกลับได้</text><text x="58" y="130" class="sub">แยกหน้าที่ Maker · Checker · ผู้อนุมัติตามวงเงิน · Finance Payment พร้อม Return / Reject ที่ชัดเจน</text>
  <g filter="url(#shadow)"><rect x="58" y="174" width="270" height="130" rx="18" fill="#eef6ff" stroke="#bfdbfe"/><rect x="362" y="174" width="270" height="130" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/><rect x="666" y="174" width="270" height="130" rx="18" fill="#f8f7ff" stroke="#ddd6fe"/><rect x="970" y="174" width="270" height="130" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><rect x="1274" y="174" width="270" height="130" rx="18" fill="#fff7ed" stroke="#fed7aa"/></g>
  <circle cx="88" cy="202" r="15" fill="#2563eb"/><text x="88" y="207" text-anchor="middle" class="stepNo">1</text><text x="112" y="208" class="stepTitle">Maker</text><text x="82" y="242" class="stepBody">สร้างคำขอจาก AP Invoice Queue</text><text x="82" y="265" class="stepBody">แนบเอกสารและส่งตรวจตาม checklist</text><text x="82" y="286" class="stepBody">แก้ไขและ Resubmit เมื่อถูก Return</text>
  <circle cx="392" cy="202" r="15" fill="#059669"/><text x="392" y="207" text-anchor="middle" class="stepNo">2</text><text x="416" y="208" class="stepTitle">Checker</text><text x="386" y="242" class="stepBody">ตรวจ PO · Invoice · GR และวิธีจ่าย</text><text x="386" y="265" class="stepBody">Document Complete จึงสร้างเส้นอนุมัติ</text><text x="386" y="286" class="stepBody">Return หรือ Reject พร้อมเหตุผลได้</text>
  <circle cx="696" cy="202" r="15" fill="#7c3aed"/><text x="696" y="207" text-anchor="middle" class="stepNo">3</text><text x="720" y="208" class="stepTitle">System</text><text x="690" y="242" class="stepBody">สร้าง approval tasks จากวงเงิน</text><text x="690" y="265" class="stepBody">บังคับลำดับและบันทึก audit log</text><text x="690" y="286" class="stepBody">ไม่ข้าม active approver</text>
  <circle cx="1000" cy="202" r="15" fill="#6d28d9"/><text x="1000" y="207" text-anchor="middle" class="stepNo">4</text><text x="1024" y="208" class="stepTitle">Approvers</text><text x="994" y="242" class="stepBody">Finance Manager / Approver / Executive</text><text x="994" y="265" class="stepBody">อนุมัติทีละ task ตามลำดับ</text><text x="994" y="286" class="stepBody">ครบทุก task จึงอนุมัติให้จ่าย</text>
  <circle cx="1304" cy="202" r="15" fill="#ea580c"/><text x="1304" y="207" text-anchor="middle" class="stepNo">5</text><text x="1328" y="208" class="stepTitle">Finance Payment</text><text x="1298" y="242" class="stepBody">Batch / Cheque preparation เป็นทางเลือก</text><text x="1298" y="265" class="stepBody">บันทึกรายละเอียด + Payment Proof</text><text x="1298" y="286" class="stepBody">Mark Paid และ sync AP Invoice</text>
  <path d="M328 239 H354" class="edge"/><path d="M632 239 H658" class="edge"/><path d="M936 239 H962" class="edge"/><path d="M1240 239 H1266" class="edge"/>
  <text x="58" y="354" class="stepTitle">สถานะหลักที่โปรแกรมใช้จริง</text><rect x="58" y="378" width="1486" height="116" rx="18" fill="#f8f7ff" stroke="#ddd6fe"/>
  <g><rect x="80" y="406" width="210" height="58" rx="11" fill="#fff" stroke="#8b5cf6"/><rect x="326" y="406" width="210" height="58" rx="11" fill="#fff" stroke="#8b5cf6"/><rect x="572" y="406" width="210" height="58" rx="11" fill="#fff" stroke="#8b5cf6"/><rect x="818" y="406" width="210" height="58" rx="11" fill="#fff" stroke="#8b5cf6"/><rect x="1064" y="406" width="210" height="58" rx="11" fill="#ede9fe" stroke="#7c3aed"/><rect x="1310" y="406" width="210" height="58" rx="11" fill="#ecfdf5" stroke="#10b981"/></g>
  <text x="185" y="441" text-anchor="middle" class="state">Pending Documents</text><text x="431" y="432" text-anchor="middle" class="state">Pending Accounting</text><text x="431" y="450" text-anchor="middle" class="state">Review</text><text x="677" y="432" text-anchor="middle" class="state">Pending Finance</text><text x="677" y="450" text-anchor="middle" class="state">Review</text><text x="923" y="432" text-anchor="middle" class="state">Pending Management</text><text x="923" y="450" text-anchor="middle" class="state">Approval</text><text x="1169" y="441" text-anchor="middle" class="state">Approved for Payment</text><text x="1415" y="441" text-anchor="middle" class="state" fill="#047857">Paid</text>
  <path d="M290 435 H318" class="edge"/><path d="M536 435 H564" class="edge"/><path d="M782 435 H810" class="edge"/><path d="M1028 435 H1056" class="edge"/><path d="M1274 435 H1302" class="edge"/>
  <text x="58" y="548" class="stepTitle">ทางออกเมื่อรายการยังไม่พร้อมหรือไม่ผ่าน</text><rect x="58" y="572" width="1486" height="214" rx="18" fill="#fffdf8" stroke="#f1d6a8"/>
  <rect x="84" y="612" width="290" height="70" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="229" y="638" text-anchor="middle" class="label">Maker-stage / Checker / Active Approver</text><text x="229" y="660" text-anchor="middle" class="small">เลือก Return หรือ Reject พร้อมเหตุผล</text>
  <rect x="438" y="602" width="240" height="88" rx="14" fill="#fff7ed" stroke="#f59e0b"/><text x="558" y="636" text-anchor="middle" class="stepTitle" fill="#9a3412">Returned for Correction</text><text x="558" y="661" text-anchor="middle" class="small">Maker แก้ไขและ Resubmit</text>
  <polygon points="782,646 852,602 922,646 852,690" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text x="852" y="642" text-anchor="middle" class="label">Checklist</text><text x="852" y="660" text-anchor="middle" class="small">ผ่าน?</text>
  <rect x="994" y="596" width="250" height="58" rx="11" fill="#f4f0ff" stroke="#8b5cf6"/><text x="1119" y="620" text-anchor="middle" class="state">Pending Accounting Review</text><text x="1119" y="640" text-anchor="middle" class="small">ผ่าน</text><rect x="994" y="684" width="250" height="58" rx="11" fill="#f4f0ff" stroke="#8b5cf6"/><text x="1119" y="708" text-anchor="middle" class="state">Pending Documents</text><text x="1119" y="728" text-anchor="middle" class="small">Checklist ยังไม่ครบ</text>
  <rect x="1310" y="602" width="206" height="88" rx="14" fill="#fef2f2" stroke="#ef4444"/><text x="1413" y="640" text-anchor="middle" class="stepTitle" fill="#b91c1c">Rejected</text><text x="1413" y="664" text-anchor="middle" class="small">สถานะปลายทาง</text>
  <path d="M374 630 H430" class="amber"/><text x="402" y="618" text-anchor="middle" class="label">Return</text><path d="M678 646 H774" class="amber"/><path d="M922 626 H986" class="edge"/><path d="M852 690 V713 H986" class="edge"/><path d="M374 667 H406 V756 H1280 V646 H1302" class="red"/><text x="850" y="746" text-anchor="middle" class="label" fill="#b91c1c">Reject → จบกระบวนการ ไม่เข้าสู่ขั้นจ่าย</text>
  <rect x="58" y="816" width="1486" height="38" rx="10" fill="#f1f5f9"/><text x="80" y="840" class="small">หลักควบคุม: Separation of Duties · Sequential Approval · Payment Proof Required · Audit Trail · Optional Payment Batch / Cheque Register</text>
</svg>
